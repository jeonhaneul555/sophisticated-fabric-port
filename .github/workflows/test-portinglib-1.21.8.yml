name: Test Porting Lib on 1.21.8

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-portinglib:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Clone Porting Lib 1.21.11
        run: |
          mkdir -p work
          git clone --depth 1 --branch 1.21.11 https://github.com/Fabricators-of-Create/Porting-Lib.git work/porting-lib
          python3 scripts/test_portinglib_1218.py
      - name: Build on Minecraft 1.21.8
        shell: bash
        run: |
          set -o pipefail
          cd work/porting-lib
          chmod +x gradlew
          ./gradlew clean build -x test --stacktrace --no-daemon 2>&1 | tee ../../portinglib-build.log
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portinglib-1.21.8-log
          path: portinglib-build.log
          if-no-files-found: ignore
