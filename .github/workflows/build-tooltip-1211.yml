name: Build Cobbleverse Auto Tooltips 1.21.1

on:
  push:
    branches: [ cobbleverse-tooltip-1211 ]
    paths:
      - 'tooltip-always/**'
      - '.github/workflows/build-tooltip-1211.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Regression test for shift-click and drag
        shell: bash
        working-directory: tooltip-always
        run: |
          mkdir -p /tmp/cobbleverse-tooltip-tests
          javac -d /tmp/cobbleverse-tooltip-tests \
            src/main/java/dev/cobbleverse/autotooltips/TooltipCallDetector.java \
            src/test/java/dev/cobbleverse/autotooltips/TooltipCallDetectorPolicyTest.java
          java -cp /tmp/cobbleverse-tooltip-tests dev.cobbleverse.autotooltips.TooltipCallDetectorPolicyTest
      - name: Build with Fabric Loom
        working-directory: tooltip-always
        run: gradle --no-daemon clean build --stacktrace
      - name: Validate distributable JAR
        working-directory: tooltip-always
        run: |
          python3 - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          import json
          jar=Path("build/libs/cobbleverse-auto-tooltips-0.2.0.jar")
          assert jar.is_file(), f"Missing distributable: {jar}"
          with ZipFile(jar) as z:
              names=set(z.namelist())
              assert "fabric.mod.json" in names
              assert "cobbleverse_auto_tooltips.mixins.json" in names
              assert any(x.endswith("/ScreenMixin.class") for x in names)
              data=json.loads(z.read("fabric.mod.json"))
              assert data["depends"]["minecraft"] == "1.21.1"
              assert data["environment"] == "client"
              print("Validated:",jar, "bytes:",jar.stat().st_size)
          PY
      - name: Publish verified JAR to branch
        run: |
          mkdir -p dist
          cp tooltip-always/build/libs/cobbleverse-auto-tooltips-0.2.0.jar dist/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f dist/cobbleverse-auto-tooltips-0.1.0.jar || true
          git add dist/cobbleverse-auto-tooltips-0.2.0.jar
          if ! git diff --cached --quiet; then
            git commit -m "Publish validated Cobbleverse auto-tooltips JAR [skip ci]"
            git push origin HEAD:cobbleverse-tooltip-1211
          fi
      - name: Upload JAR and build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobbleverse-auto-tooltips-1.21.1
          path: |
            tooltip-always/build/libs/cobbleverse-auto-tooltips-0.2.0.jar
            tooltip-always/build/reports/**
          if-no-files-found: warn
