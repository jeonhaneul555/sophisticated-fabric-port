name: Build Sophisticated Fabric 1.21.8

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Merge Fabric ports with official 1.21.8
        run: bash scripts/merge_sources.sh

      - name: Upload merge reports
        uses: actions/upload-artifact@v4
        with:
          name: merged-source-reports
          path: artifacts/*-merged-report.txt
