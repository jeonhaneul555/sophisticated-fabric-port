name: Build Sophisticated Fabric 1.21.8

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare official 1.21.8 sources and Fabric references
        run: bash scripts/prepare.sh

      - name: Upload port reports
        uses: actions/upload-artifact@v4
        with:
          name: port-reports
          path: artifacts/*-port-report.txt
